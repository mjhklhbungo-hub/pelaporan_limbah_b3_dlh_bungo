                    &lt;div&gt;
                        &lt;h4 class=&quot;text-xs font-bold uppercase tracking-wider text-emerald-800 bg-emerald-50 px-3 py-1.5 rounded-lg mb-2.5&quot;&gt;III. Pihak Lanjutan &amp; Kelengkapan Dokumen Perizinan (PDF/JPG/PNG)&lt;/h4&gt;

                        &lt;div class=&quot;px-2&quot;&gt;

                        Lihat Semua Data Laporan
                    &lt;/button&gt;

    &lt;!-- MODAL PRATINJAU FILE DOKUMEN (PDF / GAMBAR LEGALITAS PIHAK LANJUTAN) --&gt;
    &lt;div id=&quot;docPreviewModal&quot; class=&quot;hidden fixed inset-0 z-50 bg-slate-900/75 backdrop-blur-xs p-4 sm:p-6 flex items-center justify-center no-print&quot;&gt;
        &lt;div class=&quot;bg-white w-full max-w-4xl rounded-3xl shadow-2xl border border-slate-200 overflow-hidden flex flex-col max-h-[90vh] animate-slide-up&quot;&gt;
            &lt;div class=&quot;bg-slate-800 text-white px-5 py-3.5 flex items-center justify-between gap-3&quot;&gt;
                &lt;div class=&quot;truncate&quot;&gt;
                    &lt;span id=&quot;docPreviewTitle&quot; class=&quot;text-sm font-bold block truncate&quot;&gt;Pratinjau Dokumen&lt;/span&gt;
                    &lt;span id=&quot;docPreviewSubtitle&quot; class=&quot;text-xs text-slate-300 block truncate&quot;&gt;Nama File&lt;/span&gt;
                &lt;/div&gt;
                &lt;div class=&quot;flex items-center gap-2 shrink-0&quot;&gt;
                    &lt;a id=&quot;docDownloadLink&quot; href=&quot;#&quot; download=&quot;dokumen&quot; class=&quot;px-3 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold transition-colors&quot;&gt;
                        Unduh File
                    &lt;/a&gt;
                    &lt;button onclick=&quot;closeDocPreviewModal()&quot; class=&quot;p-1.5 rounded-lg text-slate-300 hover:text-white hover:bg-slate-700 transition-colors cursor-pointer&quot; aria-label=&quot;Tutup&quot;&gt;
                        ✕
                    &lt;/button&gt;
                &lt;/div&gt;

            &lt;div id=&quot;docPreviewBody&quot; class=&quot;p-4 sm:p-6 bg-slate-100 flex-1 overflow-auto flex items-center justify-center min-h-[350px]&quot;&gt;
                &lt;!-- Konten iframe PDF atau img dirender di sini --&gt;
            &lt;/div&gt;
        &lt;/div&gt;
    &lt;/div&gt;

    &lt;script&gt;
        // --- KONFIGURASI &amp; STATE APLIKASI ---
        const STORAGE_KEY = &#39;dlh_bungo_limbah_b3_reports_v2&#39;;
        const GOOGLE_SHEETS_WEB_APP_URL = &#39;https://script.google.com/macros/s/AKfycbx3GiJ_zSeRzuF7WX40r4rPt2P5CVZJCIqx9n33xawvQDuQmEGQXmXVJleeGTKOeq81/exec&#39;;
        let uploadedImageBase64 = &#39;&#39;;
        let uploadedFileName = &#39;&#39;;

        // Definisi 5 Kategori Pihak Lanjutan &amp; 4 Dokumen Legalitas Wajib
        const KATEGORI_PIHAK_LANJUTAN = [
            { id: &#39;pengangkut&#39;, label: &#39;Pengangkut Limbah B3&#39;, badge: &#39;Jasa Pengangkutan&#39; },
            { id: &#39;pengumpul&#39;, label: &#39;Pengumpul Limbah B3&#39;, badge: &#39;Pengumpulan LB3&#39; },
            { id: &#39;pemanfaat&#39;, label: &#39;Pemanfaat Limbah B3&#39;, badge: &#39;Pemanfaatan LB3&#39; },
            { id: &#39;pengolah&#39;, label: &#39;Pengolah Limbah B3&#39;, badge: &#39;Pengolahan LB3&#39; },
            { id: &#39;penimbun&#39;, label: &#39;Penimbun Limbah B3&#39;, badge: &#39;Penimbunan Akhir&#39; }
        ];

        const DOKUMEN_LEGALITAS_TYPES = [
            {
                key: &#39;perizinanBerusaha&#39;,
                label: &#39;Perizinan Berusaha&#39;,
                hint: &#39;NIB / Sertifikat Standar / Izin OSS RBA (PDF/JPG/PNG)&#39;
            },
            {
                key: &#39;persetujuanLingkungan&#39;,
                label: &#39;Persetujuan Lingkungan&#39;,
                hint: &#39;SK AMDAL / UKL-UPL / SPPL yang berlaku (PDF/JPG/PNG)&#39;
            },
            {
                key: &#39;persetujuanTeknis&#39;,
                label: &#39;Persetujuan Teknis&#39;,
                hint: &#39;Pertek Pengelolaan LB3 / Rekomendasi Pengangkutan (PDF/JPG/PNG)&#39;
            },
            {
                key: &#39;suratKelayakanOperasional&#39;,
                label: &#39;Surat Kelayakan Operasional (SLO)&#39;,
                hint: &#39;SLO Pengelolaan Limbah B3 dari instansi berwenang (PDF/JPG/PNG)&#39;
            }
        ];

        // State penyimpanan dokumen pihak lanjutan saat pengisian formulir berlangsung
        // Struktur: { pengangkut: { active: true, namaBadanUsaha: &#39;&#39;, open: true, docs: { perizinanBerusaha: { name, type, size, dataUrl, isPdfOnlyMeta }, ... } }, ... }
        let pihakLanjutanState = {};

        function initPihakLanjutanState() {
            pihakLanjutanState = {};
            KATEGORI_PIHAK_LANJUTAN.forEach((kat, idx) =&gt; {
                pihakLanjutanState[kat.id] = {
                    active: idx === 0, // Default centang kategori pertama agar pengguna langsung melihat struktur isian
                    namaBadanUsaha: &#39;&#39;,
                    open: true,
                    docs: {
                        perizinanBerusaha: null,
                        persetujuanLingkungan: null,
                        persetujuanTeknis: null,
                        suratKelayakanOperasional: null
                    }
                };
            });
        }

        // --- INISIALISASI SAAT HALAMAN DIMUAT ---
        window.onload = function() {
            // Tampilkan tanggal hari ini di header
            const options = { weekday: &#39;long&#39;, year: &#39;numeric&#39;, month: &#39;long&#39;, day: &#39;numeric&#39; };
            document.getElementById(&#39;currentDateDisplay&#39;).textContent = new Date().toLocaleDateString(&#39;id-ID&#39;, options);

            // Set nilai default input tanggal ke hari ini
            const todayISO = new Date().toISOString().split(&#39;T&#39;)[0];
            document.getElementById(&#39;tanggalTerbitIzin&#39;).value = todayISO;
            document.getElementById(&#39;tanggalDihasilkan&#39;).value = todayISO;
            document.getElementById(&#39;tanggalPenyerahan&#39;).value = todayISO;

            // Inisialisasi state &amp; UI Kategori Pihak Lanjutan
            initPihakLanjutanState();
            renderKategoriCheckboxes();
            renderPihakLanjutanCards();

            // Setup Drag &amp; Drop untuk area foto bukti penyerahan
            setupDragAndDrop();

            // Muat data laporan tersimpan dari localStorage
            renderReportsTable();
        };

        // --- RENDER CHECKBOX &amp; KARTU ACCORDION PIHAK LANJUTAN ---
        function renderKategoriCheckboxes() {
            const container = document.getElementById(&#39;kategoriPihakCheckboxes&#39;);
            container.innerHTML = &#39;&#39;;

            KATEGORI_PIHAK_LANJUTAN.forEach(kat =&gt; {
                const isChecked = pihakLanjutanState[kat.id].active;
                const labelEl = document.createElement(&#39;label&#39;);
                labelEl.className = `flex items-center gap-2.5 p-3 rounded-xl border text-xs sm:text-sm font-semibold cursor-pointer transition-all ${
                    isChecked
                        ? &#39;border-emerald-600 bg-emerald-50 text-emerald-950 shadow-2xs&#39;
                        : &#39;border-slate-200 bg-white text-slate-700 hover:bg-slate-50&#39;
                }`;
                labelEl.innerHTML = `
                    &lt;input type=&quot;checkbox&quot; ${isChecked ? &#39;checked&#39; : &#39;&#39;} onchange=&quot;toggleKategoriPihak(&#39;${kat.id}&#39;, this.checked)&quot;
                        class=&quot;w-4 h-4 rounded text-emerald-600 focus:ring-emerald-500 cursor-pointer&quot;&gt;
                    &lt;span class=&quot;truncate&quot;&gt;${kat.label}&lt;/span&gt;
                `;
                container.appendChild(labelEl);
            });
        }

        function toggleKategoriPihak(katId, checked) {
            pihakLanjutanState[katId].active = checked;
            if (checked) {
                pihakLanjutanState[katId].open = true;
                document.getElementById(&#39;kategoriPihakErrorMsg&#39;).classList.add(&#39;hidden&#39;);
            }
            renderKategoriCheckboxes();
            renderPihakLanjutanCards();
        }

        function toggleAccordionPihak(katId) {
            pihakLanjutanState[katId].open = !pihakLanjutanState[katId].open;
            renderPihakLanjutanCards();
        }

        function updateNamaBadanUsahaPihak(katId, value) {
            pihakLanjutanState[katId].namaBadanUsaha = value;
        }

        function renderPihakLanjutanCards() {
            const container = document.getElementById(&#39;pihakLanjutanCardsContainer&#39;);
            container.innerHTML = &#39;&#39;;

            const activeKats = KATEGORI_PIHAK_LANJUTAN.filter(k =&gt; pihakLanjutanState[k.id].active);
            if (activeKats.length === 0) {
                container.innerHTML = `
                    &lt;div class=&quot;p-4 rounded-2xl border border-dashed border-slate-300 bg-slate-50/70 text-center text-xs text-slate-500&quot;&gt;
                        Belum ada kategori pihak lanjutan yang dipilih. Silakan centang minimal satu kategori di atas untuk mengisi nama badan usaha dan mengunggah dokumen perizinan (PDF/JPG/PNG).
                    &lt;/div&gt;
                `;
                return;
            }

            activeKats.forEach(kat =&gt; {
                const state = pihakLanjutanState[kat.id];
                const uploadedCount = DOKUMEN_LEGALITAS_TYPES.filter(d =&gt; state.docs[d.key] !== null).length;
                const isComplete = uploadedCount === DOKUMEN_LEGALITAS_TYPES.length;

                const card = document.createElement(&#39;div&#39;);
                card.id = `card-pihak-${kat.id}`;
                card.className = &#39;border border-emerald-200/90 rounded-2xl bg-white shadow-2xs overflow-hidden transition-all&#39;;

                // Header Accordion Kartu Pihak Lanjutan
                const headerHtml = `
                    &lt;div onclick=&quot;toggleAccordionPihak(&#39;${kat.id}&#39;)&quot; class=&quot;bg-gradient-to-r from-emerald-50 to-teal-50/70 px-4 sm:px-5 py-3.5 border-b border-emerald-200/70 flex items-center justify-between gap-3 cursor-pointer select-none&quot;&gt;
                        &lt;div class=&quot;flex items-center gap-2.5 min-w-0&quot;&gt;
                            &lt;span class=&quot;px-2.5 py-1 rounded-lg bg-emerald-700 text-white text-[11px] font-bold shrink-0&quot;&gt;${kat.badge}&lt;/span&gt;
                            &lt;h3 class=&quot;text-sm sm:text-base font-bold text-slate-900 truncate&quot;&gt;${kat.label}&lt;/h3&gt;
                        &lt;/div&gt;
                        &lt;div class=&quot;flex items-center gap-2.5 shrink-0&quot;&gt;
                            &lt;span class=&quot;px-2.5 py-0.5 rounded-full text-xs font-bold ${
                                isComplete ? &#39;bg-emerald-100 text-emerald-800 border border-emerald-300&#39; : &#39;bg-amber-100 text-amber-800 border border-amber-300&#39;
                            }&quot;&gt;
                                Dokumen: ${uploadedCount}/4
                            &lt;/span&gt;
                            &lt;svg class=&quot;w-5 h-5 text-slate-600 transition-transform duration-200 ${state.open ? &#39;rotate-180&#39; : &#39;&#39;}&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot; viewBox=&quot;0 0 24 24&quot;&gt;
                                &lt;path stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot; d=&quot;M19 9l-7 7-7-7&quot; /&gt;
                            &lt;/svg&gt;
                        &lt;/div&gt;
                    &lt;/div&gt;
                `;

                // Body Accordion Kartu Pihak Lanjutan
                let docsGridHtml = &#39;&#39;;
                DOKUMEN_LEGALITAS_TYPES.forEach(docType =&gt; {
                    const fileObj = state.docs[docType.key];
                    const inputId = `file-${kat.id}-${docType.key}`;

                    let fileStatusBlock = &#39;&#39;;
                    if (!fileObj) {
                        fileStatusBlock = `
                            &lt;div onclick=&quot;document.getElementById(&#39;${inputId}&#39;).click()&quot;
                                class=&quot;mt-2 border-2 border-dashed border-slate-300 hover:border-emerald-500 bg-slate-50/70 hover:bg-emerald-50/50 rounded-xl p-3.5 text-center cursor-pointer transition-all group&quot;&gt;
                                &lt;div class=&quot;flex items-center justify-center gap-2 text-xs font-semibold text-emerald-700 group-hover:text-emerald-800&quot;&gt;
                                    &lt;svg class=&quot;w-4 h-4&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot; viewBox=&quot;0 0 24 24&quot;&gt;&lt;path stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot; d=&quot;M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12&quot;/&gt;&lt;/svg&gt;
                                    &lt;span&gt;Unggah File (PDF / JPG / PNG)&lt;/span&gt;
                                &lt;/div&gt;
                                &lt;span class=&quot;block text-[11px] text-slate-400 mt-1&quot;&gt;Maksimal ukuran file 5 MB&lt;/span&gt;
                            &lt;/div&gt;
                        `;
                    } else {
                        const isPdf = fileObj.type === &#39;application/pdf&#39;;
                        const previewThumb = isPdf
                            ? `&lt;div class=&quot;w-11 h-11 rounded-lg bg-rose-100 border border-rose-200 text-rose-700 flex flex-col items-center justify-center shrink-0 font-extrabold text-[10px]&quot;&gt;
                                    &lt;svg class=&quot;w-5 h-5 mb-0.5&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot; viewBox=&quot;0 0 24 24&quot;&gt;&lt;path stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot; d=&quot;M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z&quot;/&gt;&lt;/svg&gt;
                                    PDF
                               &lt;/div&gt;`
                            : `&lt;img src=&quot;${fileObj.dataUrl}&quot; alt=&quot;Thumbnail&quot; class=&quot;w-11 h-11 rounded-lg object-cover border border-slate-300 shrink-0 bg-white&quot;&gt;`;

                        fileStatusBlock = `
                            &lt;div class=&quot;mt-2 p-3 rounded-xl bg-emerald-50/70 border border-emerald-200 flex items-center justify-between gap-2.5&quot;&gt;
                                &lt;div class=&quot;flex items-center gap-2.5 min-w-0&quot;&gt;
                                    ${previewThumb}
                                    &lt;div class=&quot;min-w-0&quot;&gt;
                                        &lt;span class=&quot;inline-flex items-center gap-1 text-[11px] font-bold text-emerald-800&quot;&gt;
                                            ✓ Terunggah
                                        &lt;/span&gt;
                                        &lt;p class=&quot;text-xs font-semibold text-slate-800 truncate&quot; title=&quot;${fileObj.name}&quot;&gt;${fileObj.name}&lt;/p&gt;
                                        &lt;span class=&quot;text-[11px] text-slate-500 block&quot;&gt;${fileObj.sizeText}&lt;/span&gt;
                                    &lt;/div&gt;
                                &lt;/div&gt;
                                &lt;div class=&quot;flex items-center gap-1.5 shrink-0&quot;&gt;
                                    ${fileObj.dataUrl ? `
                                        &lt;button type=&quot;button&quot; onclick=&quot;previewPihakDoc(&#39;${kat.id}&#39;, &#39;${docType.key}&#39;)&quot;
                                            class=&quot;px-2.5 py-1.5 rounded-lg bg-white border border-slate-300 hover:bg-slate-100 text-slate-700 text-xs font-semibold transition-colors cursor-pointer&quot; title=&quot;Pratinjau Dokumen&quot;&gt;
                                            Lihat
                                        &lt;/button&gt;
                                    ` : &#39;&#39;}
                                    &lt;button type=&quot;button&quot; onclick=&quot;removePihakDoc(&#39;${kat.id}&#39;, &#39;${docType.key}&#39;)&quot;
                                        class=&quot;px-2 py-1.5 rounded-lg bg-rose-50 border border-rose-200 hover:bg-rose-100 text-rose-700 text-xs font-semibold transition-colors cursor-pointer&quot; title=&quot;Hapus File&quot;&gt;
                                        ✕
                                    &lt;/button&gt;
                                &lt;/div&gt;
                            &lt;/div&gt;
                        `;
                    }

                    docsGridHtml += `
                        &lt;div class=&quot;p-3.5 rounded-xl border border-slate-200/90 bg-white&quot;&gt;
                            &lt;div class=&quot;flex items-start justify-between gap-2&quot;&gt;
                                &lt;div&gt;

        // --- HANDLER UNGGAH DOKUMEN LEGALITAS PIHAK LANJUTAN (PDF / JPG / PNG) ---
        function handlePihakDocUpload(event, katId, docKey) {
            const file = event.target.files[0];
            if (!file) return;

            const validTypes = [&#39;application/pdf&#39;, &#39;image/jpeg&#39;, &#39;image/png&#39;];
            if (!validTypes.includes(file.type)) {
                showToast(&#39;Format dokumen harus berupa PDF, JPG, atau PNG.&#39;, &#39;error&#39;);
                event.target.value = &#39;&#39;;
                return;
            }

            if (file.size &gt; 5 * 1024 * 1024) {
                showToast(&#39;Ukuran dokumen maksimal adalah 5 MB.&#39;, &#39;error&#39;);
                event.target.value = &#39;&#39;;
                return;
            }

            const sizeText = file.size &gt;= 1024 * 1024
                ? `${(file.size / (1024 * 1024)).toFixed(2)} MB`
                : `${(file.size / 1024).toFixed(1)} KB`;

            const reader = new FileReader();
            reader.onload = function(e) {
                if (file.type === &#39;application/pdf&#39;) {
                    // Simpan dataUrl PDF jika berukuran &lt;= 1.2MB agar aman di localStorage; jika lebih besar simpan metadata aman
                    const isSmallPdf = file.size &lt;= 1.2 * 1024 * 1024;
                    pihakLanjutanState[katId].docs[docKey] = {
                        name: file.name,
                        type: file.type,
                        sizeText: sizeText,
                        dataUrl: isSmallPdf ? e.target.result : &#39;&#39;,
                        note: isSmallPdf ? &#39;&#39; : &#39;File PDF terlampir pada sesi pengisian (ukuran &gt; 1.2 MB dioptimalkan untuk penyimpanan browser)&#39;
                    };
                    renderPihakLanjutanCards();
                    showToast(`Dokumen PDF &quot;${file.name}&quot; berhasil dimuat.`);
                } else {
                    // Kompres gambar JPG/PNG menggunakan Canvas agar hemat kuota localStorage
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement(&#39;canvas&#39;);
                        const maxDim = 850;
                        let w = img.width;
                        let h = img.height;
                        if (w &gt; maxDim || h &gt; maxDim) {
                            if (w &gt; h) {
                                h = Math.round((h * maxDim) / w);
                                w = maxDim;
                            } else {
                                w = Math.round((w * maxDim) / h);
                                h = maxDim;
                            }
                        }
                        canvas.width = w;
                        canvas.height = h;
                        const ctx = canvas.getContext(&#39;2d&#39;);
                        ctx.drawImage(img, 0, 0, w, h);

                        pihakLanjutanState[katId].docs[docKey] = {
                            name: file.name,
                            type: file.type,
                            sizeText: sizeText,
                            dataUrl: canvas.toDataURL(&#39;image/jpeg&#39;, 0.78),
                            note: &#39;&#39;
                        };
                        renderPihakLanjutanCards();
                        showToast(`Gambar &quot;${file.name}&quot; berhasil dimuat.`);
                    };
                    img.src = e.target.result;
                }
            };
            reader.readAsDataURL(file);
        }

        // --- LOGIKA UNGGAH &amp; PRATINJAU FOTO BUKTI ---
        function setupDragAndDrop() {
            const dropZone = document.getElementById(&#39;dropZone&#39;);

            [&#39;dragenter&#39;, &#39;dragover&#39;, &#39;dragleave&#39;, &#39;drop&#39;].forEach(eventName =&gt; {
                dropZone.addEventListener(eventName, e =&gt; {
                    e.preventDefault();
                    e.stopPropagation();
                }, false);
            });

            [&#39;dragenter&#39;, &#39;dragover&#39;].forEach(eventName =&gt; {
                dropZone.addEventListener(eventName, () =&gt; {
                    dropZone.classList.add(&#39;border-emerald-600&#39;, &#39;bg-emerald-100/70&#39;);
                }, false);
            });

            [&#39;dragleave&#39;, &#39;drop&#39;].forEach(eventName =&gt; {
                dropZone.addEventListener(eventName, () =&gt; {
                    dropZone.classList.remove(&#39;border-emerald-600&#39;, &#39;bg-emerald-100/70&#39;);
                }, false);
            });

            dropZone.addEventListener(&#39;drop&#39;, e =&gt; {
                const files = e.dataTransfer.files;
                if (files.length &gt; 0) {
                    processImageFile(files[0]);
                }
            }, false);
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                processImageFile(file);
            }
        }

        function processImageFile(file) {
            const validTypes = [&#39;image/jpeg&#39;, &#39;image/png&#39;, &#39;image/webp&#39;];
            if (!validTypes.includes(file.type)) {
                showToast(&#39;Format file harus berupa JPG, PNG, atau WEBP.&#39;, &#39;error&#39;);
                return;
            }

            // Batas ukuran 5MB
            if (file.size &gt; 5 * 1024 * 1024) {
                showToast(&#39;Ukuran foto maksimal adalah 5 MB.&#39;, &#39;error&#39;);
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                // Kompres ringan gambar menggunakan canvas agar hemat memori localStorage
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement(&#39;canvas&#39;);
                    const maxDim = 900;
                    let width = img.width;
                    let height = img.height;

                    if (width &gt; maxDim || height &gt; maxDim) {
                        if (width &gt; height) {
                            height = Math.round((height * maxDim) / width);
                            width = maxDim;
                        } else {
                            width = Math.round((width * maxDim) / height);
                            height = maxDim;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext(&#39;2d&#39;);
                    ctx.drawImage(img, 0, 0, width, height);

                    uploadedImageBase64 = canvas.toDataURL(&#39;image/jpeg&#39;, 0.8);
                    uploadedFileName = file.name;

                    // Tampilkan pratinjau
                    document.getElementById(&#39;imagePreviewEl&#39;).src = uploadedImageBase64;
                    document.getElementById(&#39;fileNameDisplay&#39;).textContent = file.name;
                    document.getElementById(&#39;fileSizeDisplay&#39;).textContent = `Ukuran asli: ${(file.size / 1024).toFixed(1)} KB`;
                    
                    document.getElementById(&#39;dropZone&#39;).classList.add(&#39;hidden&#39;);
                    document.getElementById(&#39;imagePreviewContainer&#39;).classList.remove(&#39;hidden&#39;);
                    document.getElementById(&#39;fotoErrorMsg&#39;).classList.add(&#39;hidden&#39;);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function removeSelectedImage() {
            uploadedImageBase64 = &#39;&#39;;
            uploadedFileName = &#39;&#39;;
            document.getElementById(&#39;fotoBuktiInput&#39;).value = &#39;&#39;;
            document.getElementById(&#39;imagePreviewEl&#39;).src = &#39;&#39;;
            document.getElementById(&#39;imagePreviewContainer&#39;).classList.add(&#39;hidden&#39;);
            document.getElementById(&#39;dropZone&#39;).classList.remove(&#39;hidden&#39;);

        // --- VALIDASI &amp; SUBMIT FORMULIR ---
        function validateForm() {
            let isValid = true;
            const requiredIds = [&#39;namaPengisi&#39;, &#39;jabatan&#39;, &#39;namaUsaha&#39;, &#39;noTelepon&#39;, &#39;alamatUsaha&#39;, &#39;nomorIzin&#39;, &#39;tanggalTerbitIzin&#39;, &#39;jenisLimbahSelect&#39;, &#39;tanggalDihasilkan&#39;, &#39;beratLimbah&#39;];

            // Reset semua pesan error
            document.querySelectorAll(&#39;.error-msg&#39;).forEach(el =&gt; el.classList.add(&#39;hidden&#39;));
            document.querySelectorAll(&#39;input, select, textarea&#39;).forEach(el =&gt; el.classList.remove(&#39;border-rose-500&#39;));
            document.getElementById(&#39;kategoriPihakErrorMsg&#39;).classList.add(&#39;hidden&#39;);

            requiredIds.forEach(id =&gt; {
                const el = document.getElementById(id);
                const val = el.value.trim();
                const errorEl = el.closest(&#39;div&#39;).parentElement.querySelector(&#39;.error-msg&#39;) || el.parentElement.querySelector(&#39;.error-msg&#39;);

                if (!val || (id === &#39;beratLimbah&#39; &amp;&amp; parseFloat(val) &lt;= 0)) {
                    isValid = false;
                    el.classList.add(&#39;border-rose-500&#39;);
                    if (errorEl) errorEl.classList.remove(&#39;hidden&#39;);
                }
            });

            // Cek jika memilih Jenis Limbah &quot;Lainnya&quot;
            if (document.getElementById(&#39;jenisLimbahSelect&#39;).value === &#39;Lainnya&#39;) {
                const manualEl = document.getElementById(&#39;jenisLimbahManual&#39;);
                if (!manualEl.value.trim()) {
                    isValid = false;
                    manualEl.classList.add(&#39;border-rose-500&#39;);
                    manualEl.parentElement.querySelector(&#39;.error-msg&#39;).classList.remove(&#39;hidden&#39;);
                }
            }

            // Cek status penyerahan &amp; kelengkapan pihak lanjutan
            const statusPenyerahan = document.querySelector(&#39;input[name=&quot;statusPenyerahan&quot;]:checked&#39;).value;
            if (statusPenyerahan === &#39;Sudah Diserahkan ke Pihak Lanjutan&#39;) {
                const tglSerahEl = document.getElementById(&#39;tanggalPenyerahan&#39;);
                if (!tglSerahEl.value) {
                    isValid = false;
                    tglSerahEl.classList.add(&#39;border-rose-500&#39;);
                    tglSerahEl.parentElement.querySelector(&#39;.error-msg&#39;).classList.remove(&#39;hidden&#39;);
                }

                // Validasi kategori pihak lanjutan &amp; 4 dokumen legalitasnya
                const activeKats = KATEGORI_PIHAK_LANJUTAN.filter(k =&gt; pihakLanjutanState[k.id].active);
                if (activeKats.length === 0) {
                    isValid = false;
                    document.getElementById(&#39;kategoriPihakErrorMsg&#39;).classList.remove(&#39;hidden&#39;);
                } else {
                    activeKats.forEach(kat =&gt; {
                        const state = pihakLanjutanState[kat.id];
                        let hasCardError = false;

                        if (!state.namaBadanUsaha.trim()) {
                            isValid = false;
                            hasCardError = true;
                            const namaInput = document.getElementById(`nama-usaha-${kat.id}`);
                            const errNama = document.getElementById(`err-nama-${kat.id}`);
                            if (namaInput) namaInput.classList.add(&#39;border-rose-500&#39;);
                            if (errNama) errNama.classList.remove(&#39;hidden&#39;);
                        }

                        DOKUMEN_LEGALITAS_TYPES.forEach(docType =&gt; {
                            if (!state.docs[docType.key]) {
                                isValid = false;
                                hasCardError = true;
                                const errDoc = document.getElementById(`err-${kat.id}-${docType.key}`);
                                if (errDoc) errDoc.classList.remove(&#39;hidden&#39;);
                            }
                        });

                        // Buka accordion otomatis jika terdapat kolom wajib yang belum terisi
                        if (hasCardError &amp;&amp; !state.open) {
                            state.open = true;
                            renderPihakLanjutanCards();
                            // Tampilkan kembali pesan error setelah re-render
                            if (!state.namaBadanUsaha.trim()) {
                                document.getElementById(`nama-usaha-${kat.id}`)?.classList.add(&#39;border-rose-500&#39;);
                                document.getElementById(`err-nama-${kat.id}`)?.classList.remove(&#39;hidden&#39;);
                            }
                            DOKUMEN_LEGALITAS_TYPES.forEach(docType =&gt; {
                                if (!state.docs[docType.key]) {
                                    document.getElementById(`err-${kat.id}-${docType.key}`)?.classList.remove(&#39;hidden&#39;);
                                }
                            });
                        }
                    });
                }

                if (!uploadedImageBase64) {
                    isValid = false;
                    document.getElementById(&#39;fotoErrorMsg&#39;).classList.remove(&#39;hidden&#39;);
                }
            }

            return isValid;
        }

        function setSubmitLoadingState(isLoading) {
            const btnSubmit = document.getElementById(&#39;btnSubmitForm&#39;);
            const btnReset = document.getElementById(&#39;btnResetForm&#39;);
            const iconDefault = document.getElementById(&#39;submitIconDefault&#39;);
            const iconLoading = document.getElementById(&#39;submitIconLoading&#39;);

                iconLoading.classList.add(&#39;hidden&#39;);
                btnText.textContent = &#39;Kirim ke Database &amp; Pratinjau&#39;;
            }
        }

        async function handleFormSubmit(event) {
            event.preventDefault();

            if (!validateForm()) {
                showToast(&#39;Mohon lengkapi seluruh kolom wajib &amp; dokumen perizinan pihak lanjutan.&#39;, &#39;error&#39;);
                const firstError = document.querySelector(&#39;.border-rose-500, #fotoErrorMsg:not(.hidden), #kategoriPihakErrorMsg:not(.hidden), [id^=&quot;err-&quot;]:not(.hidden)&#39;);
                if (firstError) firstError.scrollIntoView({ behavior: &#39;smooth&#39;, block: &#39;center&#39; });
                return;
            }

            setSubmitLoadingState(true);

            const jenisSelect = document.getElementById(&#39;jenisLimbahSelect&#39;).value;
            const jenisFinal = jenisSelect === &#39;Lainnya&#39;
                ? document.getElementById(&#39;jenisLimbahManual&#39;).value.trim()
                : jenisSelect;
            const kodeLimbah = document.getElementById(&#39;kodeLimbah&#39;).value.trim();
            const statusPenyerahan = document.querySelector(&#39;input[name=&quot;statusPenyerahan&quot;]:checked&#39;).value;

            // Susun data pihak lanjutan yang aktif beserta 4 dokumen legalitasnya
            const pihakLanjutanData = statusPenyerahan === &#39;Sudah Diserahkan ke Pihak Lanjutan&#39;
                ? KATEGORI_PIHAK_LANJUTAN.filter(k =&gt; pihakLanjutanState[k.id].active).map(kat =&gt; {
                    const st = pihakLanjutanState[kat.id];
                    return {
                        kategoriId: kat.id,
                        kategoriLabel: kat.label,
                        namaBadanUsaha: st.namaBadanUsaha.trim(),
                        docs: JSON.parse(JSON.stringify(st.docs))
                    };
                })
                : [];

            const reports = getSavedReports();
            const randomSuffix = Math.floor(1000 + Math.random() * 9000);
            const regNumber = `LB3-BUNGO-${new Date().getFullYear()}-${randomSuffix}`;

            const newReport = {
                id: Date.now().toString(),
                regNo: regNumber,
                waktuInput: new Date().toLocaleString(&#39;id-ID&#39;, { dateStyle: &#39;medium&#39;, timeStyle: &#39;short&#39; }) + &#39; WIB&#39;,
                namaPengisi: document.getElementById(&#39;namaPengisi&#39;).value.trim(),
                jabatan: document.getElementById(&#39;jabatan&#39;).value.trim(),
                namaUsaha: document.getElementById(&#39;namaUsaha&#39;).value.trim(),
                noTelepon: document.getElementById(&#39;noTelepon&#39;).value.trim(),
                alamatUsaha: document.getElementById(&#39;alamatUsaha&#39;).value.trim(),
                nomorIzin: document.getElementById(&#39;nomorIzin&#39;).value.trim(),
                tanggalTerbitIzin: document.getElementById(&#39;tanggalTerbitIzin&#39;).value,
                jenisLimbah: jenisFinal,
                kodeLimbah: kodeLimbah,
                tanggalDihasilkan: document.getElementById(&#39;tanggalDihasilkan&#39;).value,
                beratLimbah: parseFloat(document.getElementById(&#39;beratLimbah&#39;).value),
                satuanBerat: document.getElementById(&#39;satuanBerat&#39;).value,
                statusPenyerahan: statusPenyerahan,
                tanggalPenyerahan: statusPenyerahan === &#39;Sudah Diserahkan ke Pihak Lanjutan&#39; ? document.getElementById(&#39;tanggalPenyerahan&#39;).value : &#39;-&#39;,
                nomorFestronik: statusPenyerahan === &#39;Sudah Diserahkan ke Pihak Lanjutan&#39; ? (document.getElementById(&#39;nomorFestronik&#39;).value.trim() || &#39;-&#39;) : &#39;-&#39;,
                pihakLanjutan: pihakLanjutanData,
                fotoBase64: uploadedImageBase64,
                keteranganFoto: document.getElementById(&#39;keteranganFoto&#39;).value.trim(),
                cloudSynced: false
            };

            // Kirim data ke Google Sheets &amp; Google Drive via Google Apps Script Web App
            let cloudSuccess = false;
            try {
                const response = await fetch(GOOGLE_SHEETS_WEB_APP_URL, {
                    method: &#39;POST&#39;,
                    headers: {
                        &#39;Content-Type&#39;: &#39;text/plain;charset=utf-8&#39;
                    },
                    body: JSON.stringify(newReport)
                });

                const result = await response.json();
                if (result &amp;&amp; result.status === &#39;success&#39;) {
                    cloudSuccess = true;
                    newReport.cloudSynced = true;
                } else {
                    console.warn(&#39;Respons Google Apps Script:&#39;, result);
                }
            } catch (networkErr) {
                console.error(&#39;Gagal mengirim ke Google Sheets:&#39;, networkErr);
            }

            // Simpan salinan lokal di browser agar tanda terima &amp; riwayat sesi tetap tersedia
            try {
                reports.unshift(newReport);
                localStorage.setItem(STORAGE_KEY, JSON.stringify(reports));
            } catch (e) {
                try {
                    const compactReport = JSON.parse(JSON.stringify(newReport));
                    compactReport.pihakLanjutan.forEach(p =&gt; {
                        Object.keys(p.docs).forEach(k =&gt; {
                            if (p.docs[k] &amp;&amp; p.docs[k].type === &#39;application/pdf&#39;) {
                                p.docs[k].dataUrl = &#39;&#39;;
                            }
                        });
                    });
                    reports[0] = compactReport;
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(reports));
                } catch (err2) {
                    console.warn(&#39;Penyimpanan lokal penuh, melewati cache lokal.&#39;);
                }
            }

            setSubmitLoadingState(false);

            if (cloudSuccess) {
                showToast(&#39;Berhasil terkirim ke Database Google Sheets DLH Kab. Bungo!&#39;);
            } else {
                showToast(&#39;Tersimpan di perangkat. Periksa kembali FOLDER_ID pada Apps Script jika belum masuk ke Google Sheets.&#39;, &#39;error&#39;);
            }

            renderReportsTable();
            openReceiptModal(newReport);
        }

        function resetFormConfirmation() {
            document.getElementById(&#39;limbahForm&#39;).reset();
            removeSelectedImage();
            initPihakLanjutanState();
            renderKategoriCheckboxes();
            renderPihakLanjutanCards();
            handleJenisLimbahChange();
            toggleStatusPenyerahan();
            const todayISO = new Date().toISOString().split(&#39;T&#39;)[0];
            document.getElementById(&#39;tanggalTerbitIzin&#39;).value = todayISO;
            document.getElementById(&#39;tanggalDihasilkan&#39;).value = todayISO;
            document.getElementById(&#39;tanggalPenyerahan&#39;).value = todayISO;
            document.querySelectorAll(&#39;.error-msg&#39;).forEach(el =&gt; el.classList.add(&#39;hidden&#39;));
            document.querySelectorAll(&#39;input, select, textarea&#39;).forEach(el =&gt; el.classList.remove(&#39;border-rose-500&#39;));
            showToast(&#39;Formulir telah dibersihkan.&#39;);
        }

        // --- MANAJEMEN DATA LOCALSTORAGE &amp; TABEL ---
        function getSavedReports() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                return raw ? JSON.parse(raw) : [];
            } catch (e) {
                return [];
            }
        }

        function formatTanggalIndo(dateStr) {
            if (!dateStr || dateStr === &#39;-&#39;) return &#39;-&#39;;
            const [y, m, d] = dateStr.split(&#39;-&#39;);
            const bulan = [&#39;Jan&#39;, &#39;Feb&#39;, &#39;Mar&#39;, &#39;Apr&#39;, &#39;Mei&#39;, &#39;Jun&#39;, &#39;Jul&#39;, &#39;Agu&#39;, &#39;Sep&#39;, &#39;Okt&#39;, &#39;Nov&#39;, &#39;Des&#39;];
            return `${d} ${bulan[parseInt(m, 10) - 1]} ${y}`;
        }

        function renderReportsTable() {
            const reports = getSavedReports();
            const tbody = document.getElementById(&#39;reportsTableBody&#39;);
            const emptyState = document.getElementById(&#39;emptyStateList&#39;);
            const badgeCount = document.getElementById(&#39;badgeCount&#39;);

            badgeCount.textContent = reports.length;
            tbody.innerHTML = &#39;&#39;;

            if (reports.length === 0) {
                emptyState.classList.remove(&#39;hidden&#39;);
                return;
            }
            emptyState.classList.add(&#39;hidden&#39;);

            reports.forEach(item =&gt; {
                const tr = document.createElement(&#39;tr&#39;);
                tr.className = &#39;hover:bg-emerald-50/40 transition-colors&#39;;

                const isDiserahkan = item.statusPenyerahan === &#39;Sudah Diserahkan ke Pihak Lanjutan&#39;;
                const pihakRingkas = (item.pihakLanjutan &amp;&amp; item.pihakLanjutan.length &gt; 0)
                    ? item.pihakLanjutan.map(p =&gt; `${p.kategoriLabel}: ${p.namaBadanUsaha}`).join(&#39;; &#39;)
                    : &#39;&#39;;
                const statusBadge = isDiserahkan
                    ? `&lt;span class=&quot;inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-800&quot;&gt;Sudah Diserahkan&lt;/span&gt;
                       &lt;span class=&quot;block text-xs text-slate-500 mt-0.5&quot;&gt;${formatTanggalIndo(item.tanggalPenyerahan)}&lt;/span&gt;
                       &lt;span class=&quot;block text-[11px] text-emerald-700 font-medium mt-0.5 line-clamp-2&quot; title=&quot;${pihakRingkas}&quot;&gt;${pihakRingkas}&lt;/span&gt;`
                    : `&lt;span class=&quot;inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-amber-100 text-amber-800&quot;&gt;Disimpan di TPS LB3&lt;/span&gt;`;

                const fotoThumb = item.fotoBase64
                    ? `&lt;button onclick=&quot;viewReportById(&#39;${item.id}&#39;)&quot; class=&quot;inline-block w-12 h-12 rounded-xl overflow-hidden border border-slate-300 hover:ring-2 hover:ring-emerald-500 transition-all cursor-pointer&quot; title=&quot;Klik untuk memperbesar&quot;&gt;&lt;img src=&quot;${item.fotoBase64}&quot; alt=&quot;Bukti&quot; class=&quot;w-full h-full object-cover&quot;&gt;&lt;/button&gt;`
                    : `&lt;span class=&quot;text-xs text-slate-400 italic&quot;&gt;Tidak ada&lt;/span&gt;`;

                tr.innerHTML = `
                    &lt;td class=&quot;py-3.5 px-4 align-top&quot;&gt;
                        &lt;span class=&quot;font-mono text-xs font-bold text-emerald-800 block&quot;&gt;${item.regNo}&lt;/span&gt;
                        &lt;span class=&quot;text-xs text-slate-500&quot;&gt;${item.waktuInput}&lt;/span&gt;
                    &lt;/td&gt;
                    &lt;td class=&quot;py-3.5 px-4 align-top&quot;&gt;
                        &lt;span class=&quot;font-bold text-slate-900 block&quot;&gt;${item.namaUsaha}&lt;/span&gt;
                        &lt;span class=&quot;text-xs text-slate-600&quot;&gt;${item.namaPengisi} (${item.jabatan})&lt;/span&gt;
                        &lt;span class=&quot;block text-[11px] text-slate-400 mt-0.5&quot;&gt;Izin: ${item.nomorIzin}&lt;/span&gt;
                    &lt;/td&gt;
                    &lt;td class=&quot;py-3.5 px-4 align-top&quot;&gt;
                        &lt;span class=&quot;font-semibold text-slate-800 block&quot;&gt;${item.jenisLimbah}&lt;/span&gt;
                        &lt;span class=&quot;text-xs text-slate-500&quot;&gt;Tgl Hasil: ${formatTanggalIndo(item.tanggalDihasilkan)} • &lt;strong class=&quot;text-emerald-700&quot;&gt;${item.beratLimbah} ${item.satuanBerat}&lt;/strong&gt;&lt;/span&gt;
                    &lt;/td&gt;
                    &lt;td class=&quot;py-3.5 px-4 align-top&quot;&gt;${statusBadge}&lt;/td&gt;
                    &lt;td class=&quot;py-3.5 px-4 align-top text-center&quot;&gt;${fotoThumb}&lt;/td&gt;
                    &lt;td class=&quot;py-3.5 px-4 align-top text-right whitespace-nowrap&quot;&gt;
                        &lt;button onclick=&quot;viewReportById(&#39;${item.id}&#39;)&quot; class=&quot;px-3 py-1.5 rounded-lg bg-emerald-50 hover:bg-emerald-100 text-emerald-800 text-xs font-semibold transition-colors cursor-pointer mr-1&quot;&gt;
                            Detail / Cetak
                        &lt;/button&gt;
                        &lt;button onclick=&quot;deleteReportById(&#39;${item.id}&#39;)&quot; class=&quot;px-2.5 py-1.5 rounded-lg bg-rose-50 hover:bg-rose-100 text-rose-700 text-xs font-semibold transition-colors cursor-pointer&quot; title=&quot;Hapus Data&quot;&gt;
                            Hapus
                        &lt;/button&gt;
                    &lt;/td&gt;
                `;
                tbody.appendChild(tr);
            });
        }

        function viewReportById(id) {
            const report = getSavedReports().find(r =&gt; r.id === id);
            if (report) openReceiptModal(report);
        }

        function deleteReportById(id) {
            const filtered = getSavedReports().filter(r =&gt; r.id !== id);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(filtered));
            renderReportsTable();
            showToast(&#39;Data laporan dihapus dari riwayat sesi.&#39;);
        }

        // --- MODAL PRATINJAU TANDA TERIMA ---
        function openReceiptModal(report) {
            document.getElementById(&#39;recRegNo&#39;).textContent = report.regNo;
            document.getElementById(&#39;recUsaha&#39;).textContent = report.namaUsaha;
            document.getElementById(&#39;recIzin&#39;).textContent = report.nomorIzin;
            document.getElementById(&#39;recTglIzin&#39;).textContent = formatTanggalIndo(report.tanggalTerbitIzin);
            document.getElementById(&#39;recPengisi&#39;).textContent = `${report.namaPengisi} (${report.jabatan})`;
            document.getElementById(&#39;recTelepon&#39;).textContent = report.noTelepon;
            document.getElementById(&#39;recAlamat&#39;).textContent = report.alamatUsaha;

            const jenisLengkap = report.kodeLimbah &amp;&amp; !report.jenisLimbah.includes(report.kodeLimbah)
                ? `${report.jenisLimbah} [Kode: ${report.kodeLimbah}]`
                : report.jenisLimbah;
            document.getElementById(&#39;recJenisLimbah&#39;).textContent = jenisLengkap;
            document.getElementById(&#39;recTglHasil&#39;).textContent = formatTanggalIndo(report.tanggalDihasilkan);
            document.getElementById(&#39;recBerat&#39;).textContent = `${report.beratLimbah} ${report.satuanBerat}`;

            const statusTeks = report.statusPenyerahan === &#39;Sudah Diserahkan ke Pihak Lanjutan&#39;
                ? `Sudah Diserahkan (${formatTanggalIndo(report.tanggalPenyerahan)})`
                : report.statusPenyerahan;
            document.getElementById(&#39;recPenyerahan&#39;).textContent = statusTeks;
            document.getElementById(&#39;recFestronik&#39;).textContent = report.nomorFestronik || &#39;-&#39;;
            document.getElementById(&#39;recWaktuInput&#39;).textContent = report.waktuInput;

            // Render Daftar Pihak Lanjutan &amp; Kelengkapan 4 Dokumen Legalitas
            const pihakContainer = document.getElementById(&#39;recPihakLanjutanList&#39;);
            pihakContainer.innerHTML = &#39;&#39;;

            if (!report.pihakLanjutan || report.pihakLanjutan.length === 0) {
                pihakContainer.innerHTML = `&lt;p class=&quot;text-xs text-slate-500 italic py-1&quot;&gt;Limbah masih disimpan sementara di TPS LB3 (belum diserahkan ke pihak lanjutan).&lt;/p&gt;`;
            } else {
                report.pihakLanjutan.forEach((pihak, idx) =&gt; {
                    const box = document.createElement(&#39;div&#39;);
                    box.className = &#39;border border-slate-200 rounded-2xl p-3.5 bg-slate-50/70&#39;;

                    let docsListHtml = &#39;&#39;;
                    DOKUMEN_LEGALITAS_TYPES.forEach(docType =&gt; {
                        const docFile = pihak.docs ? pihak.docs[docType.key] : null;
                        if (docFile) {
                            const isPdf = docFile.type === &#39;application/pdf&#39;;
                            const previewBtn = docFile.dataUrl
                                ? `&lt;button type=&quot;button&quot; onclick=&quot;openSavedReportDoc(&#39;${report.id}&#39;, ${idx}, &#39;${docType.key}&#39;)&quot; class=&quot;no-print px-2 py-0.5 rounded bg-emerald-100 hover:bg-emerald-200 text-emerald-800 text-[11px] font-semibold cursor-pointer ml-1.5&quot;&gt;Buka File&lt;/button&gt;`
                                : &#39;&#39;;
                            docsListHtml += `
                                &lt;li class=&quot;flex flex-wrap items-center justify-between gap-1 text-xs py-1 border-b border-slate-200/60 last:border-none&quot;&gt;
                                    &lt;span class=&quot;font-medium text-slate-700&quot;&gt;${docType.label}:&lt;/span&gt;
                                    &lt;span class=&quot;text-emerald-800 font-semibold flex items-center&quot;&gt;
                                        ✓ ${docFile.name} (${isPdf ? &#39;PDF&#39; : &#39;Gambar&#39;})
                                        ${previewBtn}
                                    &lt;/span&gt;
                                &lt;/li&gt;
                            `;
                        } else {
                            docsListHtml += `
                                &lt;li class=&quot;flex items-center justify-between text-xs py-1 border-b border-slate-200/60 last:border-none&quot;&gt;
                                    &lt;span class=&quot;font-medium text-slate-700&quot;&gt;${docType.label}:&lt;/span&gt;
                                    &lt;span class=&quot;text-rose-600&quot;&gt;Belum dilampirkan&lt;/span&gt;
                                &lt;/li&gt;
                            `;
                        }
                    });

                    box.innerHTML = `
                        &lt;div class=&quot;flex flex-wrap items-center justify-between gap-2 mb-2 pb-1.5 border-b border-slate-200&quot;&gt;
                            &lt;span class=&quot;text-xs font-extrabold uppercase tracking-wide text-emerald-900&quot;&gt;${idx + 1}. ${pihak.kategoriLabel}&lt;/span&gt;
                            &lt;span class=&quot;text-xs font-bold text-slate-900 bg-white px-2.5 py-0.5 rounded-lg border border-slate-200&quot;&gt;${pihak.namaBadanUsaha}&lt;/span&gt;
                        &lt;/div&gt;
                        &lt;ul class=&quot;space-y-0.5&quot;&gt;${docsListHtml}&lt;/ul&gt;
                    `;
                    pihakContainer.appendChild(box);
                });
            }

            const fotoWrapper = document.getElementById(&#39;recFotoWrapper&#39;);
            const noFotoText = document.getElementById(&#39;recNoFotoText&#39;);
            if (report.fotoBase64) {
                fotoWrapper.classList.remove(&#39;hidden&#39;);
                noFotoText.classList.add(&#39;hidden&#39;);
                document.getElementById(&#39;recFotoImg&#39;).src = report.fotoBase64;
                document.getElementById(&#39;recKetFoto&#39;).textContent = report.keteranganFoto || &#39;Dokumentasi bukti penyerahan / penyimpanan Limbah B3.&#39;;
            } else {
                fotoWrapper.classList.add(&#39;hidden&#39;);
                noFotoText.classList.remove(&#39;hidden&#39;);
            }

            document.getElementById(&#39;receiptModalBackdrop&#39;).classList.remove(&#39;hidden&#39;);
        }

        function openSavedReportDoc(reportId, pihakIndex, docKey) {
            const report = getSavedReports().find(r =&gt; r.id === reportId);
            if (!report || !report.pihakLanjutan || !report.pihakLanjutan[pihakIndex]) return;
            const pihak = report.pihakLanjutan[pihakIndex];
            const docFile = pihak.docs[docKey];
            const docDef = DOKUMEN_LEGALITAS_TYPES.find(d =&gt; d.key === docKey);
            if (docFile &amp;&amp; docFile.dataUrl) {
                openDocPreviewModal(`${docDef.label} — ${pihak.kategoriLabel} (${pihak.namaBadanUsaha})`, docFile.name, docFile.type, docFile.dataUrl);
            }
        }

        function closeReceiptModal() {
            document.getElementById(&#39;receiptModalBackdrop&#39;).classList.add(&#39;hidden&#39;);
        }

        // --- EKSPOR KE CSV ---
        function exportToCSV() {
            const reports = getSavedReports();
            if (reports.length === 0) {
                showToast(&#39;Tidak ada data laporan untuk diekspor.&#39;, &#39;error&#39;);
                return;
            }

            const headers = [
                &#39;No Registrasi&#39;, &#39;Waktu Input&#39;, &#39;Nama Perusahaan/Usaha&#39;, &#39;Nama Pengisi&#39;,
                &#39;Jabatan&#39;, &#39;No Telepon&#39;, &#39;Alamat Usaha&#39;, &#39;Nomor Izin/Rintek TPS LB3&#39;, &#39;Tanggal Terbit Izin&#39;,
                &#39;Jenis Limbah B3&#39;, &#39;Kode Limbah&#39;, &#39;Tanggal Dihasilkan&#39;, &#39;Berat&#39;, &#39;Satuan&#39;,
                &#39;Status Penyerahan&#39;, &#39;Tanggal Penyerahan&#39;, &#39;Nomor Festronik&#39;,
                &#39;Pihak Lanjutan &amp; Kelengkapan Dokumen (Perizinan Berusaha, Persetujuan Lingkungan, Pertek, SLO)&#39;,
                &#39;Keterangan Foto&#39;
            ];

            const rows = reports.map(r =&gt; {
                const ringkasanPihak = (r.pihakLanjutan &amp;&amp; r.pihakLanjutan.length &gt; 0)
                    ? r.pihakLanjutan.map(p =&gt; {
                        const docNames = DOKUMEN_LEGALITAS_TYPES.map(d =&gt; `${d.label}: ${p.docs?.[d.key]?.name || &#39;Tidak ada&#39;}`).join(&#39; | &#39;);
                        return `[${p.kategoriLabel} - ${p.namaBadanUsaha} (${docNames})]`;
                    }).join(&#39; ; &#39;)
                    : &#39;-&#39;;

                return [
                    r.regNo, r.waktuInput, r.namaUsaha, r.namaPengisi,
                    r.jabatan, r.noTelepon, r.alamatUsaha, r.nomorIzin, r.tanggalTerbitIzin || &#39;-&#39;,
                    r.jenisLimbah, r.kodeLimbah, r.tanggalDihasilkan, r.beratLimbah, r.satuanBerat,
                    r.statusPenyerahan, r.tanggalPenyerahan, r.nomorFestronik || &#39;-&#39;,
                    ringkasanPihak, r.keteranganFoto
                ].map(val =&gt; `&quot;${String(val || &#39;&#39;).replace(/&quot;/g, &#39;&quot;&quot;&#39;)}&quot;`).join(&#39;,&#39;);
            });

            const csvContent = &#39;\uFEFF&#39; + [headers.join(&#39;,&#39;), ...rows].join(&#39;\n&#39;);
            const blob = new Blob([csvContent], { type: &#39;text/csv;charset=utf-8;&#39; });
            const url = URL.createObjectURL(blob);

            const link = document.createElement(&#39;a&#39;);
            link.href = url;
            link.setAttribute(&#39;download&#39;, `Laporan_Limbah_B3_DLH_Bungo_${new Date().toISOString().split(&#39;T&#39;)[0]}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);

            showToast(&#39;File CSV berhasil diunduh.&#39;);
        }
    &lt;/script&gt;
